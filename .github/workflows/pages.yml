name: Pages

on:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Website

    runs-on: ubuntu-latest

    steps:
      - uses: ./.github/actions/setup

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build Website
        run: bunx turbo run build --filter=website

      - name: Upload Build
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./apps/website/dist

  e2e:
    name: E2E Test Website

    needs:
      - build

    runs-on: ubuntu-latest

    steps:
      - uses: ./.github/actions/setup

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium firefox

      - name: Run E2E Tests
        run: bunx turbo run e2e --filter=website-e2e

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: E2E Report
          path: apps/website-e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 1

  deploy:
    name: Deploy Website

    needs:
      - e2e

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
